[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpvrp-cc-tools"
version = "0.1.0"
description = "Local Python startup tools for the MPVRP-CC benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.8",
    "numpy>=2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]
